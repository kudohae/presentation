<!doctype html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presentations</title>
<style>
  :root{--bg:#ffffff;--fg:#1b1b1f;--dim:#6b6b73;--line:#e6e6ea;--hover:#f5f5f7}
  @media (prefers-color-scheme:dark){:root{--bg:#121214;--fg:#ececf0;--dim:#9a9aa3;--line:#2a2a2f;--hover:#1c1c20}}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg)}
  body{font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  main{max-width:760px;margin:0 auto;padding:72px 24px 96px}
  h1{font-size:32px;font-weight:700;letter-spacing:-.02em;margin:0}
  .sub{color:var(--dim);margin:6px 0 40px}
  ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
  li{border-bottom:1px solid var(--line)}
  a.row{display:flex;align-items:baseline;gap:16px;padding:20px 8px;color:inherit;text-decoration:none;transition:background .15s}
  a.row:hover,a.row:focus-visible{background:var(--hover);outline:none}
  .title{font-size:20px;font-weight:600;letter-spacing:-.01em;flex:1;min-width:0;overflow-wrap:anywhere}
  .folder{display:block;font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--dim);margin-top:4px}
  .date{color:var(--dim);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .msg{color:var(--dim);padding:24px 8px}
  .msg a{color:inherit}
  /* opening a presentation: browsers with cross-document view transitions fly the title into the deck,
     others get a cover in the deck's background colour */
  @view-transition{navigation:auto}
  ::view-transition-group(deck-title){animation-duration:.75s;animation-timing-function:cubic-bezier(.7,0,.15,1)}
::view-transition-old(deck-title){display:none}
::view-transition-new(deck-title){animation:none}
  ::view-transition-old(root),::view-transition-new(root){animation-duration:.45s}
  .tt{display:inline-block}
  .cover{position:fixed;left:0;right:0;z-index:10;pointer-events:none}
  .cover-title{position:fixed;z-index:11;margin:0;pointer-events:none;transform-origin:0 0;white-space:nowrap}
  @media (max-width:520px){main{padding:48px 16px 72px}a.row{flex-direction:column;gap:6px}}
</style>
</head>
<body>
<main>
  <h1>Presentations</h1>
  <p class="sub">Ku Dohae</p>
  <ul id="list"><li class="msg">불러오는 중…</li></ul>
</main>
<script>
// Lists every top-level folder of the repo as a presentation.
// Folders starting with "_" or "." are hidden. Title comes from the folder's index.html <title>,
// the date from the folder's latest commit. GitHub answers are cached for 10 minutes.
const REPO='kudohae/presentation', API='https://api.github.com/repos/'+REPO, TTL=10*60*1000;
const list=document.getElementById('list');

async function gh(path){
  const key='gh:'+path;
  try{const c=JSON.parse(localStorage.getItem(key)||'null');if(c&&Date.now()-c.t<TTL)return c.v;}catch(e){}
  const r=await fetch(API+path,{headers:{Accept:'application/vnd.github+json'}});
  if(!r.ok)throw new Error(r.status);
  const v=await r.json();
  try{localStorage.setItem(key,JSON.stringify({t:Date.now(),v}));}catch(e){}
  return v;
}
// title and background colour of a presentation, read from its index.html
async function metaOf(name){
  try{const r=await fetch(encodeURIComponent(name)+'/');if(!r.ok)return {};
    const d=new DOMParser().parseFromString(await r.text(),'text/html'),t=d.querySelector('title'),c=d.querySelector('meta[name="theme-color"]');
    return {title:t&&t.textContent.trim()||null,bg:c&&c.content||null};}catch(e){return {};}
}
async function dateOf(name){
  try{const c=await gh('/commits?per_page=1&path='+encodeURIComponent(name));
    return c[0]?new Date(c[0].commit.committer.date):null;}catch(e){return null;}
}
const fmt=d=>d?`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`:'';
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

(async()=>{
  let items;
  try{items=(await gh('/contents/')).filter(x=>x.type==='dir'&&!/^[_.]/.test(x.name));}
  catch(e){list.innerHTML=`<li class="msg">목록을 불러오지 못했어요. 잠시 뒤 새로고침하거나 <a href="https://github.com/${REPO}">저장소</a>에서 폴더를 열어 주세요.</li>`;return;}
  if(!items.length){list.innerHTML='<li class="msg">아직 발표가 없어요.</li>';return;}
  const rows=await Promise.all(items.map(async x=>{const m=await metaOf(x.name);return {name:x.name,title:m.title,bg:m.bg,date:await dateOf(x.name)};}));
  rows.sort((a,b)=>(b.date||0)-(a.date||0)||a.name.localeCompare(b.name));
  list.innerHTML=rows.map(r=>`<li><a class="row" href="${encodeURIComponent(r.name)}/" data-bg="${esc(r.bg||'#ffffff')}">
      <span class="title"><span class="tt">${esc(r.title||r.name)}</span><span class="folder">/${esc(r.name)}</span></span>
      <span class="date">${fmt(r.date)}</span></a></li>`).join('');
})();

const VT='CSSViewTransitionRule' in window;
list.addEventListener('click',e=>{
  const a=e.target.closest('a.row');if(!a||e.button||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;
  document.querySelectorAll('.tt').forEach(t=>t.style.viewTransitionName='');
  if(VT){a.querySelector('.tt').style.viewTransitionName='deck-title';return;}
  e.preventDefault();cover(a);
});
// fallback: the clicked row opens up into the deck's background colour, then the deck loads on the same colour
function cover(a){
  const r=a.getBoundingClientRect(),tt=a.querySelector('.tt'),tr=tt.getBoundingClientRect(),cs=getComputedStyle(tt);
  const c=document.createElement('div');c.className='cover';c.style.background=a.dataset.bg;c.style.top=r.top+'px';c.style.height=r.height+'px';
  const t=document.createElement('div');t.className='cover-title';t.textContent=tt.textContent;
  Object.assign(t.style,{left:tr.left+'px',top:tr.top+'px',font:cs.font,letterSpacing:cs.letterSpacing,color:'#141417'});
  document.body.append(c,t);
  const ease='cubic-bezier(.7,0,.15,1)',H=innerHeight;
  c.animate([{top:r.top+'px',height:r.height+'px'},{top:'0px',height:H+'px'}],{duration:520,easing:ease,fill:'forwards'});
  const k=Math.min(3,(innerWidth*.6)/tr.width);
  t.animate([{transform:'none',opacity:1},{transform:`translate(${innerWidth/2-tr.left-tr.width*k/2}px,${H/2-tr.top-tr.height*k/2}px) scale(${k})`,opacity:0}],{duration:520,easing:ease,fill:'forwards'});
  setTimeout(()=>{location.href=a.href;},500);
}
// coming back (also from the back/forward cache): clear the cover and the transition name
addEventListener('pageshow',()=>{document.querySelectorAll('.cover,.cover-title').forEach(x=>x.remove());document.querySelectorAll('.tt').forEach(t=>t.style.viewTransitionName='');});
</script>
</body>
</html>
