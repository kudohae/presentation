<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мои выходные</title>
<style>
@font-face{font-family:'Inter Tight';font-weight:500;font-display:block;src:url(fonts/inter-tight-latin-500-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2122}
@font-face{font-family:'Inter Tight';font-weight:500;font-display:block;src:url(fonts/inter-tight-cyrillic-500-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Inter Tight';font-weight:700;font-display:block;src:url(fonts/inter-tight-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2122}
@font-face{font-family:'Inter Tight';font-weight:700;font-display:block;src:url(fonts/inter-tight-cyrillic-700-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Inter Tight';font-weight:800;font-display:block;src:url(fonts/inter-tight-latin-800-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2122}
@font-face{font-family:'Inter Tight';font-weight:800;font-display:block;src:url(fonts/inter-tight-cyrillic-800-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Inter';font-weight:400;font-display:block;src:url(fonts/inter-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2122}
@font-face{font-family:'Inter';font-weight:400;font-display:block;src:url(fonts/inter-cyrillic-400-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Inter';font-weight:500;font-display:block;src:url(fonts/inter-latin-500-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2122}
@font-face{font-family:'Inter';font-weight:500;font-display:block;src:url(fonts/inter-cyrillic-500-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Inter';font-weight:600;font-display:block;src:url(fonts/inter-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2122}
@font-face{font-family:'Inter';font-weight:600;font-display:block;src:url(fonts/inter-cyrillic-600-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}

:root{--bg:#0b0b0d;--fg:#f5f5f7;--dim:#8a8a90;--line:#2a2a30;--accent:#ff5a4e;--ok:#34c77b;--water:#18222c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;cursor:default;user-select:none}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:50% 50%;overflow:hidden;
  background:radial-gradient(ellipse at 30% 40%,#141418 0%,var(--bg) 70%)}
#night{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}

/* persistent chrome */
#chapter{position:absolute;left:140px;top:96px;font:600 22px/1 'Inter';letter-spacing:.22em;text-transform:uppercase;color:var(--dim);height:24px;overflow:hidden}
#chapter span{display:inline-block}
#chapter b{color:var(--fg);font-weight:600;margin-right:14px}
#bar{position:absolute;left:0;bottom:0;height:4px;width:1920px;background:var(--accent);transform-origin:0 50%;transform:scaleX(0)}

/* headline */
.hl{position:absolute;left:140px;top:0;width:760px;font:800 96px/1.04 'Inter Tight';letter-spacing:-.035em}
.hl.sm{font-size:72px;width:660px}
.hl.xl{font-size:190px;width:1500px;letter-spacing:-.045em}
.hl.center{left:0;width:1920px;text-align:center}
.hl em{font-style:normal;color:var(--accent)}
.hl .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em;margin-bottom:-.08em;margin-right:.2em}
.hl .w:last-child{margin-right:0}
.hl .w>span{display:inline-block}
.sub{position:absolute;left:140px;font:500 34px/1.3 'Inter';color:var(--dim)}

/* scene layer */
.scene{position:absolute;inset:0}
.vis{position:absolute;left:980px;top:140px;width:820px;height:800px}
.frame{position:absolute;border-radius:22px;overflow:hidden;background:#000;box-shadow:0 40px 80px rgba(0,0,0,.55)}
.frame img,.frame video{display:block;width:100%;height:100%;object-fit:cover}
.big{font:800 300px/1 'Inter Tight';letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.outline{color:transparent;-webkit-text-stroke:3px var(--fg)}
.label{font:600 26px/1 'Inter';letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.odo{display:inline-flex;white-space:nowrap}
.odo .col{display:inline-block;height:1em;overflow:hidden;line-height:1}
.odo .strip{display:flex;flex-direction:column}
.odo .strip span{height:1em;line-height:1}
.pill{display:inline-flex;align-items:center;gap:18px;font:600 40px/1 'Inter';padding:26px 34px;border:2px solid var(--line);border-radius:999px;margin-bottom:22px}
.pill i{font-style:normal;color:var(--ok)}
svg text{font-family:'Inter';font-weight:600}
</style>
</head>
<body>
<div id="stage">
  <div id="night"></div>
  <div id="layer"></div>
  <div id="chapter"></div>
  <div id="bar"></div>
</div>

<script src="vendor/gsap.min.js"></script>
<script>
// ===================== helpers =====================
const $=(h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild;};
const layer=document.getElementById('layer');
const OUT='expo.out', IO='expo.inOut';

// headline with per-word mask reveal
function headline(html,cls,top){
  const el=$(`<div class="hl ${cls||''}"></div>`);
  html=html.replace(/<em>(.*?)<\/em>/g,(m,t)=>t.split(' ').map(w=>`<em>${w}</em>`).join(' '));
  el.innerHTML=html.replace(/(<em>.*?<\/em>[^\s<]*|[^\s<]+)/g,m=>`<span class="w"><span>${m}</span></span>`);
  el.style.top=(top||0)+'px';
  return el;
}
function revealWords(tl,el,at){tl.fromTo(el.querySelectorAll('.w>span'),{yPercent:115},{yPercent:0,duration:1.0,ease:OUT,stagger:.05},at);}
function hideWords(tl,el,at){tl.to(el.querySelectorAll('.w>span'),{yPercent:-115,duration:.45,ease:'power3.in',stagger:.015},at);tl.add(()=>el.remove());}
function vcenter(el,mid){ // place headline vertically around a mid line
  layer.appendChild(el); const h=el.offsetHeight; el.style.top=(mid-h/2)+'px'; return el;
}
// odometer number (digits roll)
function odo(text,cls){
  const el=$(`<div class="odo ${cls||''}"></div>`);
  for(const ch of text){
    if(/\d/.test(ch)){const c=$(`<span class="col"><span class="strip">${[...'0123456789'].map(d=>`<span>${d}</span>`).join('')}</span></span>`);c.dataset.d=ch;el.appendChild(c);}
    else el.appendChild($(`<span>${ch}</span>`));
  }
  setOdo(el,text,null,0);
  return el;
}
function setOdo(el,text,tl,at){
  const cols=[...el.querySelectorAll('.col')];const digits=[...text].filter(c=>/\d/.test(c));
  cols.forEach((c,i)=>{const y=-(+digits[i])+'em';
    if(tl) tl.to(c.firstChild,{y,duration:1.4,ease:IO},at+i*.07); else gsap.set(c.firstChild,{y});});
}
function counter(tl,el,from,to,dur,at,ease){const o={v:from};tl.to(o,{v:to,duration:dur,ease:ease||'power3.out',onUpdate:()=>el.textContent=Math.round(o.v)},at);}
function draw(tl,paths,dur,at,stagger){paths.forEach(p=>{const L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L;});
  tl.to(paths,{strokeDashoffset:0,duration:dur,ease:'power2.inOut',stagger:stagger||0},at);}
function rise(tl,els,at,dy){tl.fromTo(els,{y:dy||40,opacity:0},{y:0,opacity:1,duration:1.1,ease:OUT,stagger:.08},at);}
function wipe(tl,frame,at){const inner=frame.querySelector('img,video');
  tl.fromTo(frame,{clipPath:'inset(100% 0% 0% 0% round 22px)'},{clipPath:'inset(0% 0% 0% 0% round 22px)',duration:1.3,ease:IO},at);
  tl.fromTo(inner,{scale:1.25},{scale:1.04,duration:2.2,ease:OUT},at);}
function drift(el){gsap.to(el,{x:'-=26',duration:14,ease:'none'});}

// door (line art) for the toilet chapter; drawn around origin
const NS='http://www.w3.org/2000/svg';
function door(missing){
  const g=document.createElementNS(NS,'g');
  g.innerHTML=`<rect x="-100" y="-170" width="200" height="340" rx="10" fill="none" stroke="#f5f5f7" stroke-width="4" vector-effect="non-scaling-stroke"/>
   <rect x="-74" y="-144" width="148" height="118" rx="6" fill="none" stroke="#f5f5f7" stroke-opacity=".3" stroke-width="3" vector-effect="non-scaling-stroke"/>
   <circle cx="68" cy="14" r="7" fill="#f5f5f7"/>
   <rect class="latch" x="48" y="-22" width="40" height="22" rx="5" fill="${missing?'none':'#f5f5f7'}" stroke="${missing?'#ff5a4e':'#f5f5f7'}" stroke-width="3" ${missing?'stroke-dasharray="6 5"':''} vector-effect="non-scaling-stroke"/>`;
  return g;
}

// ===================== scenes =====================
// Each scene builds its DOM; each step is a function (tl, S) that animates from the previous step's state.
const ROUTE=[[230,230],[300,150],[360,170],[360,430],[540,510],[720,640],[930,700],[1100,770],[1190,860],[1310,895]];
const SCENES={
 title:{build(S){
   S.eb=$(`<div class="label" style="position:absolute;left:140px;top:370px">Русский язык · выходные</div>`);layer.appendChild(S.eb);
   S.line=$(`<div style="position:absolute;left:140px;top:720px;width:420px;height:4px;background:var(--accent);transform-origin:0 50%"></div>`);layer.appendChild(S.line);
   S.name=$(`<div class="sub" style="top:760px">Ku Dohae</div>`);layer.appendChild(S.name);
 }},
 cal:{build(S){
   S.box=$(`<div class="vis" style="display:flex;flex-direction:column;justify-content:center;align-items:flex-end;text-align:right"></div>`);layer.appendChild(S.box);
   S.lab=$(`<div class="label" style="margin-bottom:28px">ноябрь</div>`);S.box.appendChild(S.lab);
   S.date=odo('08.11','big outline');S.box.appendChild(S.date);
   S.ads=$(`<div class="big" style="font-size:230px;color:var(--accent);margin-top:10px;opacity:0">ADsP</div>`);S.box.appendChild(S.ads);
   drift(S.box);
 }},
 map:{build(S){
   S.box=$(`<div class="vis" style="top:200px;height:620px"></div>`);layer.appendChild(S.box);
   const pts=ROUTE.map(p=>p.join(',')).join(' ');
   S.svg=$(`<svg viewBox="0 0 1600 1100" width="820" height="564" style="overflow:visible">
     <path d="M-60 1070 C380 980 780 1110 1140 1020 S1470 900 1660 760" fill="none" stroke="#18222c" stroke-width="120" stroke-linecap="round"/>
     <path d="M760 -40 C740 250 820 420 700 620 S590 900 640 1030" fill="none" stroke="#18222c" stroke-width="26" stroke-linecap="round"/>
     <text x="380" y="1078" font-size="40" fill="#4c6478" letter-spacing="6">РЕКА ХАН</text>
     <polyline points="${pts}" fill="none" stroke="#3a3a42" stroke-width="6" stroke-dasharray="2 18" stroke-linecap="round" stroke-linejoin="round"/>
     <polyline class="route" points="${pts}" fill="none" stroke="#ff5a4e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
     <g class="a"><circle cx="230" cy="230" r="16" fill="#f5f5f7"/><text x="230" y="320" text-anchor="middle" font-size="52" fill="#f5f5f7">Анам</text></g>
     <g class="b"><circle cx="1310" cy="895" r="16" fill="#f5f5f7"/><text x="1310" y="820" text-anchor="middle" font-size="52" fill="#f5f5f7">Кваннару</text></g>
     <circle class="bus" cx="0" cy="0" r="22" fill="#ff5a4e" stroke="#0b0b0d" stroke-width="8"/>
     <g class="school" fill="none" stroke="#f5f5f7" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
       <path d="M1210 700 V600 L1310 530 L1410 600 V700 Z"/><path d="M1290 700 V650 H1330 V700"/><path d="M1240 610 H1270 M1350 610 H1380"/><path d="M1310 530 V470 L1350 485 L1310 500"/>
     </g>
   </svg>`);S.box.appendChild(S.svg);
   S.tag=$(`<div class="label" style="position:absolute;left:0;top:-70px">автобус 130</div>`);S.box.appendChild(S.tag);
   S.route=S.svg.querySelector('.route');S.bus=S.svg.querySelector('.bus');S.school=[...S.svg.querySelectorAll('.school path')];
   S.L=S.route.getTotalLength();S.route.style.strokeDasharray=S.L;S.route.style.strokeDashoffset=S.L;
   gsap.set([S.svg.querySelector('.a'),S.svg.querySelector('.b'),S.bus,S.tag],{opacity:0});
   S.school.forEach(p=>{const L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L;});
 }},
 wc:{build(S){
   S.box=$(`<div class="vis"></div>`);layer.appendChild(S.box);
   S.svg=document.createElementNS(NS,'svg');S.svg.setAttribute('viewBox','0 0 820 800');S.svg.setAttribute('width','820');S.svg.setAttribute('height','800');S.svg.style.overflow='visible';S.box.appendChild(S.svg);
   S.doors=[];
   for(let f=0;f<4;f++)for(let c=0;c<4;c++){const d=door(!(f===3&&c===0));d.dataset.f=f;d.dataset.c=c;S.svg.appendChild(d);S.doors.push(d);gsap.set(d,{opacity:0,x:410,y:400,scale:1.3});}
   S.first=S.doors[12]; // floor 1 (bottom row), first door: the one we see first
   S.labels=[];for(let f=0;f<4;f++){const t=document.createElementNS(NS,'text');t.setAttribute('x','40');t.setAttribute('y',String(110+f*190));t.setAttribute('font-size','34');t.setAttribute('fill','#8a8a90');t.textContent=(4-f);S.svg.appendChild(t);S.labels.push(t);gsap.set(t,{opacity:0});}
   S.cig=document.createElementNS(NS,'g');S.cig.innerHTML=`<g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="7">
     <path d="M250 430 H520 V470 H250 Z" stroke="#f5f5f7"/><path d="M520 430 H570 V470 H520" stroke="#ff5a4e"/>
     <path d="M560 410 C540 370 600 350 575 300 C555 260 610 240 590 200" stroke="#8a8a90"/>
     <circle cx="410" cy="420" r="230" stroke="#ff5a4e" stroke-width="12"/><path d="M248 258 L572 582" stroke="#ff5a4e" stroke-width="12"/></g>`;
   S.svg.appendChild(S.cig);S.cigPaths=[...S.cig.querySelectorAll('path,circle')];
   S.cigPaths.forEach(p=>{const L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L;});
   S.check=document.createElementNS(NS,'path');S.check.setAttribute('d','M0 0');S.check.setAttribute('fill','none');S.check.setAttribute('stroke','#34c77b');S.check.setAttribute('stroke-width','8');S.check.setAttribute('stroke-linecap','round');S.check.setAttribute('stroke-linejoin','round');S.svg.appendChild(S.check);
 }},
 han:{build(S){
   S.photo=$(`<div class="frame" style="left:1000px;top:250px;width:780px;height:521px"><img src="media/hangang.jpg"></div>`);layer.appendChild(S.photo);
   S.cnt=$(`<div style="position:absolute;left:1000px;top:250px;width:780px;height:521px;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0"><div class="big" style="font-size:340px">0</div><div class="label" style="margin-top:6px;color:var(--fg)">часа</div></div>`);layer.appendChild(S.cnt);S.num=S.cnt.firstChild;
   S.video=$(`<div class="frame" style="left:900px;top:240px;width:900px;height:506px;opacity:0"><video src="media/hangang.mp4" preload="auto" playsinline></video></div>`);layer.appendChild(S.video);
   S.vlab=$(`<div class="label" style="position:absolute;left:900px;top:776px;opacity:0">«Сумерки» · «Gravity»</div>`);layer.appendChild(S.vlab);
   S.v=S.video.querySelector('video');
 }},
 fest:{build(S){
   S.box=$(`<div class="vis" style="display:flex;flex-direction:column;justify-content:center;align-items:flex-end;text-align:right"></div>`);layer.appendChild(S.box);
   S.lab=$(`<div class="label" style="margin-bottom:28px">Анам · 31.10</div>`);S.box.appendChild(S.lab);
   S.time=$(`<div class="big outline">21:00</div>`);S.box.appendChild(S.time);
   S.list=$(`<div style="position:absolute;left:980px;top:300px;display:flex;flex-direction:column;align-items:flex-start"></div>`);layer.appendChild(S.list);
   ['сцена','свет и звук','<span style="color:var(--fg)">глава района</span>'].forEach(t=>S.list.appendChild($(`<div class="pill"><i>✓</i>${t}</div>`)));
   S.pills=[...S.list.children];gsap.set(S.pills,{opacity:0});
   S.zero=$(`<div style="position:absolute;left:980px;top:200px;width:820px;height:680px;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0"><div class="big" style="font-size:420px">0</div><div class="label" style="color:var(--fg)">зрителей</div></div>`);layer.appendChild(S.zero);S.zn=S.zero.firstChild;
   S.video=$(`<div class="frame" style="left:1260px;top:150px;width:440px;height:782px;opacity:0"><video src="media/anam.mp4" preload="auto" playsinline></video></div>`);layer.appendChild(S.video);
   S.vlab=$(`<div class="label" style="position:absolute;left:1260px;top:956px;opacity:0">3 песни</div>`);layer.appendChild(S.vlab);
   S.v=S.video.querySelector('video');
 }},
 home:{build(S){
   S.box=$(`<div class="vis" style="display:flex;flex-direction:column;justify-content:center;align-items:flex-end;text-align:right"></div>`);layer.appendChild(S.box);
   S.lab=$(`<div class="label" style="margin-bottom:28px;height:26px;overflow:hidden"><span style="display:block">суббота · вечер</span></div>`);S.box.appendChild(S.lab);
   S.date=odo('31.10','big outline');S.box.appendChild(S.date);
   S.moon=$(`<svg viewBox="0 0 400 400" width="360" height="360" style="position:absolute;left:1360px;top:300px;overflow:visible"><path d="M250 60 A150 150 0 1 0 340 270 A120 120 0 1 1 250 60 Z" fill="none" stroke="#f5f5f7" stroke-width="6" stroke-linejoin="round"/></svg>`);layer.appendChild(S.moon);
   S.moonP=S.moon.querySelector('path');const L=S.moonP.getTotalLength();S.moonP.style.strokeDasharray=L;S.moonP.style.strokeDashoffset=L;
   drift(S.box);
 }},
 end:{build(S){
   S.line=$(`<div style="position:absolute;left:760px;top:700px;width:400px;height:4px;background:var(--accent);transform:scaleX(0)"></div>`);layer.appendChild(S.line);
 }}
};

// ===================== steps =====================
// text: headline (Russian). hl: class. mid: vertical center of headline.
const STEPS=[
 {id:'t0',scene:'title',chapter:'',text:'Мои выходные',hl:'xl',mid:540,
   run(tl,S){rise(tl,S.eb,.0,20);tl.fromTo(S.line,{scaleX:0},{scaleX:1,duration:1.2,ease:IO},.5);rise(tl,S.name,.8,20);}},
 {id:'b1',scene:'cal',chapter:'01|Пролог',text:'В прошлые выходные я <em>только</em> учился.',
   run(tl,S){rise(tl,[S.lab,S.date],.25);}},
 {id:'b2',scene:'cal',text:'<em>Две недели</em> назад…',
   run(tl,S){tl.to(S.lab,{opacity:0,duration:.3},0).add(()=>S.lab.textContent='октябрь').to(S.lab,{opacity:1,duration:.5},.4);setOdo(S.date,'31.10',tl,.1);}},
 {id:'c1',scene:'cal',chapter:'02|Экзамен',text:'В субботу я сдавал <em>экзамен</em>.',
   run(tl,S){tl.to(S.lab,{opacity:0,duration:.3},0).add(()=>S.lab.textContent='суббота').to(S.lab,{opacity:1,duration:.5},.4);
     tl.to(S.date,{fontSize:150,duration:1.1,ease:IO},.1);tl.fromTo(S.ads,{opacity:0,y:60},{opacity:1,y:0,duration:1.1,ease:OUT},.55);}},
 {id:'d2',scene:'map',text:'Я поехал на автобусе на станцию <em>Кваннару</em>.',hl:'sm',
   run(tl,S){const A=S.svg.querySelector('.a'),B=S.svg.querySelector('.b');rise(tl,[S.tag,A],.3,20);
     const o={t:0};tl.to(o,{t:1,duration:3.2,ease:'power2.inOut',onUpdate:()=>{const L=S.L*o.t;S.route.style.strokeDashoffset=S.L-L;const p=S.route.getPointAtLength(L);S.bus.setAttribute('cx',p.x);S.bus.setAttribute('cy',p.y);}},.7);
     tl.set(S.bus,{attr:{cx:230,cy:230}},0);tl.to(S.bus,{opacity:1,duration:.3},.6);rise(tl,B,3.4,20);}},
 {id:'d3',scene:'map',text:'Экзамен был в <em>средней школе</em>.',hl:'sm',
   run(tl,S){tl.to(S.bus,{opacity:0,duration:.4},0);tl.to(S.svg.querySelector('.b text'),{opacity:0,duration:.3},0);draw(tl,S.school,1.2,.3,.12);}},
 {id:'e1',scene:'wc',chapter:'03|Туалет',text:'Я пошёл в <em>туалет</em>.',
   run(tl,S){const d=S.first;gsap.set(d,{x:410,y:400,scale:1.3});d.querySelector('.latch').setAttribute('fill','#f5f5f7');d.querySelector('.latch').setAttribute('stroke','#f5f5f7');d.querySelector('.latch').removeAttribute('stroke-dasharray');
     tl.fromTo(d,{opacity:0,y:440},{opacity:1,y:400,duration:1.2,ease:OUT},.3);}},
 {id:'e2',scene:'wc',text:'Но <em>замка</em> не было!',
   run(tl,S){const l=S.first.querySelector('.latch');

// ===================== engine =====================
const stage=document.getElementById('stage'), chap=document.getElementById('chapter'), bar=document.getElementById('bar');
function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(-50%,-50%) scale(${k})`;}
fit();addEventListener('resize',fit);

let cur=-1, S=null, sceneName=null, hlEl=null, tlNow=null, curChapter='';
function chapterOf(i){for(let k=i;k>=0;k--){if(STEPS[k].chapter!==undefined)return STEPS[k].chapter;}return '';}
function setChapter(c,instant){
  if(c===curChapter)return; curChapter=c;
  const html=c?`<span><b>${c.split('|')[0]}</b>${c.split('|')[1]}</span>`:'<span></span>';
  if(instant){chap.innerHTML=html;return;}
  const old=chap.firstChild;
  gsap.to(old,{yPercent:-110,duration:.4,ease:'power2.in',onComplete:()=>{chap.innerHTML=html;gsap.fromTo(chap.firstChild,{yPercent:110},{yPercent:0,duration:.8,ease:OUT});}});
}
function stopVideos(){layer.querySelectorAll('video').forEach(v=>v.pause());}
function makeHeadline(st){
  const el=headline(st.text,st.hl);
  const mid=st.mid||(st.hl&&st.hl.includes('sm')?520:530);
  vcenter(el,mid); return el;
}
function buildScene(name){
  layer.innerHTML='';gsap.set('#night',{opacity:0});
  S={};SCENES[name].build(S);sceneName=name;hlEl=null;
}
function playStep(i,animate){
  const st=STEPS[i];
  const tl=gsap.timeline({paused:!animate});
  // headline swap
  if(hlEl){const old=hlEl;if(animate)hideWords(tl,old,0);else old.remove();}
  hlEl=makeHeadline(st);
  gsap.set(hlEl.querySelectorAll('.w>span'),{yPercent:115});
  revealWords(tl,hlEl,animate?.25:0);
  st.run(tl,S);
  if(!animate) tl.progress(1);
  return tl;
}
function go(i,opts={}){
  i=Math.max(0,Math.min(STEPS.length-1,i)); if(i===cur&&!opts.force)return;
  const prev=cur; cur=i; const st=STEPS[i];
  if(tlNow) tlNow.progress(1);
  stopVideos();
  gsap.to(bar,{scaleX:i/(STEPS.length-1),duration:1.2,ease:IO});
  setChapter(chapterOf(i),opts.instant);
  const forwardOne=(i===prev+1)&&!opts.instant;
  if(forwardOne && st.scene===sceneName){
    tlNow=playStep(i,true);
  } else if(forwardOne){
    // scene change: everything on screen leaves, then the new scene builds
    const out=gsap.timeline();
    if(hlEl) hideWords(out,hlEl,0);
    out.to(layer.children,{opacity:0,y:-24,filter:'blur(6px)',duration:.5,ease:'power2.in',stagger:.03},0);
    out.to('#night',{opacity:0,duration:.5},0);
    out.add(()=>{gsap.set(layer,{clearProps:'all'});buildScene(st.scene);tlNow=playStep(i,true);},.6);
    tlNow=out;
  } else {
    // jump or go back: rebuild the scene and fast-forward to this step
    buildScene(st.scene);
    let k=i;while(k>0&&STEPS[k-1].scene===st.scene)k--;
    for(let j=k;j<=i;j++) playStep(j,false);
    gsap.fromTo(layer,{opacity:0},{opacity:1,duration:.35});
  }
  if(st.video){const v=S[st.video];if(v){v.currentTime=0;v.muted=false;setTimeout(()=>{if(STEPS[cur]===st)v.play().catch(()=>{});},forwardOne?1500:200);}}
  try{history.replaceState(null,'','#'+(i+1));}catch(e){}
}
addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown',' ','Enter','ArrowDown'].includes(e.key)){e.preventDefault();go(cur+1);}
  else if(['ArrowLeft','PageUp','ArrowUp','Backspace'].includes(e.key)){e.preventDefault();go(cur-1);}
  else if(e.key==='Home')go(0); else if(e.key==='End')go(STEPS.length-1);
  else if(e.key==='f'||e.key==='F'||e.key==='а'||e.key==='А'){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen();}
});
addEventListener('click',e=>{if(e.button===0)go(cur+1);});
addEventListener('contextmenu',e=>{e.preventDefault();go(cur-1);});
document.fonts.ready.then(()=>{
  const h=parseInt((location.hash||'#1').slice(1))||1;
  if(h===1){buildScene('title');cur=0;setChapter('',true);tlNow=playStep(0,true);}
  else go(h-1,{instant:true});
});
</script>
