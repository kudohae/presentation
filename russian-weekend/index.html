<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мои выходные</title>
<style>
@font-face{font-family:'Inter Tight';font-weight:700;font-display:block;src:url(fonts/inter-tight-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2122}
@font-face{font-family:'Inter Tight';font-weight:700;font-display:block;src:url(fonts/inter-tight-cyrillic-700-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Inter Tight';font-weight:800;font-display:block;src:url(fonts/inter-tight-latin-800-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2122}
@font-face{font-family:'Inter Tight';font-weight:800;font-display:block;src:url(fonts/inter-tight-cyrillic-800-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Inter';font-weight:500;font-display:block;src:url(fonts/inter-latin-500-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2122}
@font-face{font-family:'Inter';font-weight:500;font-display:block;src:url(fonts/inter-cyrillic-500-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Inter';font-weight:600;font-display:block;src:url(fonts/inter-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2122}
@font-face{font-family:'Inter';font-weight:600;font-display:block;src:url(fonts/inter-cyrillic-600-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}

/* light theme for bright rooms; night colours are tweened in for the last chapter */
:root{--bg:#f6f4f0;--fg:#141417;--dim:#4d4d55;--line:#cfcac1;--accent:#e0362a;--ok:#1f9d55;--water:#bcd8ec}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;cursor:default;user-select:none}
/* 4:3 stage, 100px safe margin everywhere */
#stage{position:absolute;left:50%;top:50%;width:1600px;height:1200px;transform-origin:50% 50%;overflow:hidden;background:var(--bg);color:var(--fg)}
#layer{position:absolute;inset:0}
#chapter{position:absolute;left:110px;top:96px;font:600 28px/1 'Inter';letter-spacing:.18em;text-transform:uppercase;color:var(--dim);height:32px;overflow:hidden}
#chapter span{display:inline-block}
#chapter b{color:var(--accent);font-weight:700;margin-right:16px}
#bar{position:absolute;left:0;bottom:0;height:8px;width:1600px;background:var(--accent);transform-origin:0 50%;transform:scaleX(0)}

/* chapter title overlay (replaces the red card), battery HUD, persistent map */
#cbig{position:absolute;left:110px;top:170px;display:flex;align-items:baseline;gap:44px;pointer-events:none;z-index:4}
#cbig .n,#cbig .t{overflow:hidden;padding-bottom:.08em}
#cbig .n span{display:block;font:800 230px/.9 'Inter Tight';letter-spacing:-.05em;color:var(--accent)}
#cbig .t span{display:block;font:800 104px/1 'Inter Tight';letter-spacing:-.035em;color:var(--fg)}
#bat{position:absolute;right:110px;top:88px;display:flex;align-items:center;opacity:0}
#bat .body{width:120px;height:52px;border:5px solid var(--fg);border-radius:12px;padding:5px;display:flex;gap:5px}
#bat .cell{flex:1;background:var(--fg);border-radius:3px}
#bat .nub{width:8px;height:20px;background:var(--fg);border-radius:0 4px 4px 0;margin-left:3px}
#world{position:absolute;left:110px;top:430px;width:1380px;height:670px;opacity:0}

/* headline */
.hl{position:absolute;left:110px;width:1380px;font:800 92px/1.04 'Inter Tight';letter-spacing:-.035em;color:var(--fg)}
.hl.sm{font-size:76px}
.hl.side{width:780px}
.hl.xl{font-size:200px;letter-spacing:-.05em;line-height:.95}
.hl.center{text-align:center}
.hl em{font-style:normal;color:var(--accent)}
.hl .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.1em;margin-bottom:-.1em;margin-right:.2em}
.hl .w:last-child{margin-right:0}
.hl .w>span{display:inline-block}

.area{position:absolute;left:110px;width:1380px}
.frame{position:absolute;border-radius:28px;overflow:hidden;background:#000}
.frame img,.frame video{display:block;width:100%;height:100%;object-fit:cover}
.big{font:800 400px/.9 'Inter Tight';letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.label{font:600 30px/1 'Inter';letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.odo{display:inline-flex;white-space:nowrap}
.odo .col{display:inline-block;height:.9em;overflow:hidden;line-height:.9}
.odo .strip{display:flex;flex-direction:column}
.odo .strip span{height:.9em;line-height:.9}
svg text{font-family:'Inter';font-weight:600}
</style>
</head>
<body>
<div id="stage">
  <div id="world"></div>
  <div id="layer"></div>
  <div id="cbig"><div class="n"><span>02</span></div><div class="t"><span></span></div></div>
  <div id="chapter"><span></span></div>
  <div id="bat"><div class="body"><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div></div><div class="nub"></div></div>
  <div id="bar"></div>
</div>

<script src="vendor/gsap.min.js"></script>
<script>
// ===================== helpers =====================
const $=(h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild;};
const layer=document.getElementById('layer'), root=document.documentElement;
const OUT='expo.out', IO='expo.inOut';
const LIGHT={'--bg':'#f6f4f0','--fg':'#141417','--dim':'#4d4d55','--accent':'#e0362a'}, FLASH={'--bg':'#e0362a','--fg':'#ffffff','--dim':'#ffd6d0','--accent':'#f6f4f0'}, NIGHT={'--bg':'#10142a','--fg':'#f2f2f5','--dim':'#a3a8c3'};

function headline(html,cls){
  html=html.replace(/<em>(.*?)<\/em>/g,(m,t)=>t.split(' ').map(w=>`<em>${w}</em>`).join(' '));
  const el=$(`<div class="hl ${cls||''}"></div>`);
  el.innerHTML=html.replace(/(<em>.*?<\/em>[^\s<]*|[^\s<]+)/g,m=>`<span class="w"><span>${m}</span></span>`);
  return el;
}
function revealWords(tl,el,at){tl.fromTo(el.querySelectorAll('.w>span'),{yPercent:115},{yPercent:0,duration:1.0,ease:OUT,stagger:.05},at);}
function hideWords(tl,el,at){tl.to(el.querySelectorAll('.w>span'),{yPercent:-115,duration:.45,ease:'power3.in',stagger:.015},at);tl.add(()=>el.remove());}
function odo(text,cls){
  const el=$(`<div class="odo ${cls||''}"></div>`);
  for(const ch of text){
    if(/\d/.test(ch)) el.appendChild($(`<span class="col"><span class="strip">${[...'0123456789'].map(d=>`<span>${d}</span>`).join('')}</span></span>`));
    else el.appendChild($(`<span>${ch}</span>`));
  }
  setOdo(el,text); return el;
}
function setOdo(el,text,tl,at){
  const cols=[...el.querySelectorAll('.col')], ds=[...text].filter(c=>/\d/.test(c));
  cols.forEach((c,i)=>{const y=-(+ds[i]*.9)+'em'; if(tl) tl.to(c.firstChild,{y,duration:1.4,ease:IO},at+i*.07); else gsap.set(c.firstChild,{y});});
}
function counter(tl,el,from,to,dur,at,ease){const o={v:from};tl.to(o,{v:to,duration:dur,ease:ease||'power3.out',onUpdate:()=>el.textContent=Math.round(o.v)},at);}
function prep(paths){paths.forEach(p=>{const L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L;p.style.opacity=0;});}
function draw(tl,paths,dur,at,st,ease){tl.set(paths,{opacity:1},at);tl.to(paths,{strokeDashoffset:0,duration:dur,ease:ease||'power2.inOut',stagger:st||0},at);}
function rise(tl,els,at,dy){tl.fromTo(els,{y:dy||50,opacity:0},{y:0,opacity:1,duration:1.1,ease:OUT,stagger:.08},at);}
function wipe(tl,frame,at){const inner=frame.querySelector('img,video');
  tl.fromTo(frame,{clipPath:'inset(100% 0% 0% 0% round 28px)'},{clipPath:'inset(0% 0% 0% 0% round 28px)',duration:1.3,ease:IO},at);
  tl.fromTo(inner,{scale:1.2},{scale:1.02,duration:2.2,ease:OUT},at);}

// SVG camera: the viewBox is the camera, so views can follow, push in and pull back
function setVB(C){const c=C.cam,w=c.h*C.R;C.svg.setAttribute('viewBox',`${c.cx-w/2} ${c.cy-c.h/2} ${w} ${c.h}`);}
function camTo(tl,C,to,dur,at,ease){tl.to(C.cam,{...to,duration:dur,ease:ease||IO,onUpdate:()=>setVB(C)},at);}
function camSet(tl,C,to,at){tl.set(C.cam,{...to,onComplete:()=>setVB(C)},at);}
const SOFT='linear-gradient(to right,transparent,#000 5%,#000 95%,transparent),linear-gradient(to bottom,transparent,#000 6%,#000 94%,transparent)';
const MASK=`overflow:hidden;-webkit-mask-image:${SOFT};-webkit-mask-composite:source-in;mask-image:${SOFT};mask-composite:intersect`;

const NS='http://www.w3.org/2000/svg', INK='#141417', RED='#e0362a', GREEN='#1f9d55';
function sv(tag,attrs,html){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(html)e.innerHTML=html;return e;}
function door(missing){
  // stall door: partition posts on both sides, a gap under the door, a WC plate
  return sv('g',{},`<path d="M-130 -175 V170 M130 -175 V170 M-146 170 H-114 M114 170 H146" fill="none" stroke="${INK}" stroke-width="6" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
   <rect x="-100" y="-165" width="200" height="295" rx="6" fill="#fff" stroke="${INK}" stroke-width="6" vector-effect="non-scaling-stroke"/>
   <text x="0" y="-98" text-anchor="middle" font-size="40" fill="${INK}" fill-opacity=".45" letter-spacing="4">WC</text>
   <circle cx="66" cy="16" r="9" fill="${INK}"/>
   <rect class="latch" x="44" y="-24" width="44" height="26" rx="6" fill="${missing?'none':INK}" stroke="${missing?RED:INK}" stroke-width="4" ${missing?'stroke-dasharray="7 6"':''} vector-effect="non-scaling-stroke"/>`);
}
// draw a path while the camera rides its head (used for walking down the building)
function follow(tl,C,path,dur,at,ease){const L=path.getTotalLength(),o={t:0};tl.set(path,{opacity:1},at);
  tl.to(o,{t:1,duration:dur,ease:ease||'sine.inOut',onUpdate:()=>{const l=L*o.t;path.style.strokeDashoffset=L-l;const p=path.getPointAtLength(l);C.cam.cx=p.x*.55;C.cam.cy=p.y-190;setVB(C);}},at);}
function smooth(pts){let d=`M${pts[0][0]} ${pts[0][1]}`;
  for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    d+=` C${p1[0]+(p2[0]-p0[0])/6} ${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6} ${p2[1]-(p3[1]-p1[1])/6} ${p2[0]} ${p2[1]}`;}
  return d;}
const line=pts=>'M'+pts.map(p=>p.join(' ')).join(' L');

// ===================== the day map (lives across scenes) =====================
// schematic, roughly to scale: Anam crossroads (home), Gwangnaru station, Jayang station
const A=[490,176],G=[1240,693],J=[870,869];
const STN=[[1120,605],[990,542],[940,655],[900,756]];
const LEGS=[smooth([A,[570,205],[660,300],[780,375],[910,440],[1040,540],[1140,650],G]),
            line([G,...STN,J]),
            smooth([J,[835,790],[770,650],[690,500],[600,330],[540,235],A])];
const CAM={A0:{cx:490,cy:176,h:440},AG:{cx:890,cy:455,h:760},SCH:{cx:1290,cy:580,h:510},G:{cx:1240,cy:660,h:540},
           J:{cx:870,cy:869,h:600},A:{cx:490,cy:176,h:600},LOOP:{cx:900,cy:520,h:900},HOME:{cx:455,cy:145,h:340}};
const W={el:document.getElementById('world'),R:1380/670,cam:{...CAM.A0}};
(function buildWorld(){
  W.svg=sv('svg',{width:1380,height:670});W.svg.style.cssText=MASK;W.el.appendChild(W.svg);
  W.svg.innerHTML=`
   <path d="${smooth([[-300,905],[300,850],[600,800],[870,955],[1100,925],[1300,745],[1700,470]])}" fill="none" stroke="#bcd8ec" stroke-width="110" stroke-linecap="round"/>
   <path d="${smooth([[1000,-300],[800,315],[700,504],[600,800]])}" fill="none" stroke="#bcd8ec" stroke-width="26" stroke-linecap="round"/>
   <text x="210" y="880" font-size="40" fill="#4a7395" letter-spacing="6">РЕКА ХАН</text>
   ${LEGS.map(d=>`<path class="leg" d="${d}" fill="none" stroke="${RED}" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>`).join('')}
   ${STN.map(p=>`<circle class="stn" cx="${p[0]}" cy="${p[1]}" r="13" style="fill:var(--bg)" stroke="${RED}" stroke-width="7"/>`).join('')}
   <g class="school" fill="none" stroke="${INK}" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" transform="translate(1290 623)">
     <path vector-effect="non-scaling-stroke" d="M-110 0 V-110 L0 -190 L110 -110 V0 Z"/><path vector-effect="non-scaling-stroke" d="M-18 0 V-60 H18 V0"/>
     <path vector-effect="non-scaling-stroke" d="M-75 -95 H-40 M40 -95 H75"/><path vector-effect="non-scaling-stroke" d="M0 -190 V-255 L45 -238 L0 -221"/></g>
   <g class="house" fill="none" stroke="${INK}" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" transform="translate(${A[0]} ${A[1]-34})">
     <path d="M-42 0 V-52 L0 -88 L42 -52 V0 Z"/><path d="M-11 0 V-28 H11 V0"/></g>
   <text class="hlab" x="${A[0]-62}" y="${A[1]-60}" text-anchor="end" font-size="58" fill="${RED}">Дом</text>
   <g class="pin"><circle cx="${A[0]}" cy="${A[1]}" r="20" fill="${INK}"/><text x="${A[0]-40}" y="${A[1]+20}" text-anchor="end" font-size="58" fill="${INK}">Анам</text></g>
   <g class="pin"><circle cx="${G[0]}" cy="${G[1]}" r="20" fill="${INK}"/><text x="${G[0]-30}" y="${G[1]+80}" text-anchor="end" font-size="58" fill="${INK}">Кваннару</text></g>
   <g class="pin"><circle cx="${J[0]}" cy="${J[1]}" r="20" fill="${INK}"/><text x="${J[0]-42}" y="${J[1]+20}" text-anchor="end" font-size="58" fill="${INK}">Чаян</text></g>
   <circle class="ring" cx="${A[0]}" cy="${A[1]}" r="20" fill="none" stroke="${RED}" stroke-width="6" opacity="0"/>
   <circle class="dot" r="28" fill="${RED}" stroke="#f6f4f0" stroke-width="10"/>`;
  W.legs=[...W.svg.querySelectorAll('.leg')];W.len=W.legs.map(p=>p.getTotalLength());
  W.legs.forEach((p,k)=>p.style.strokeDasharray=W.len[k]);
  W.stn=[...W.svg.querySelectorAll('.stn')];W.pins=[...W.svg.querySelectorAll('.pin')];W.dot=W.svg.querySelector('.dot');
  W.school=[...W.svg.querySelectorAll('.school path')];W.house=[...W.svg.querySelectorAll('.house path')];W.hlab=W.svg.querySelector('.hlab');W.ring=W.svg.querySelector('.ring');
  gsap.set(W.stn,{transformOrigin:'50% 50%'});
  setVB(W);
})();
// a leg of the trip: the line draws, the dot rides it, the camera rides with the dot
function drive(tl,k,at,dur,h){const P=W.legs[k],L=W.len[k],o={t:0};
  tl.set(W.dot,{opacity:1},at);
  tl.to(o,{t:1,duration:dur,ease:'power2.inOut',onUpdate:()=>{const l=L*o.t;P.style.strokeDashoffset=L-l;const p=P.getPointAtLength(l);
    W.dot.setAttribute('cx',p.x);W.dot.setAttribute('cy',p.y);W.cam.cx=p.x;W.cam.cy=p.y;setVB(W);}},at);
  if(h)tl.to(W.cam,{h,duration:dur,ease:'power1.inOut'},at);}

// ===================== scenes =====================
const SCENES={
 title:{build(S){
   S.eb=$(`<div class="label" style="position:absolute;left:110px;top:330px">Русский язык</div>`);layer.appendChild(S.eb);
   S.line=$(`<div style="position:absolute;left:110px;top:850px;width:520px;height:10px;background:var(--accent);transform-origin:0 50%;transform:scaleX(0)"></div>`);layer.appendChild(S.line);
   S.name=$(`<div style="position:absolute;left:110px;top:905px;font:600 48px/1 'Inter';color:var(--dim)">Ku Dohae</div>`);layer.appendChild(S.name);
 }},
 cal:{build(S){
   S.box=$(`<div class="area" style="top:520px;height:580px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end"></div>`);layer.appendChild(S.box);
   S.lab=$(`<div class="label" style="margin-bottom:34px;height:32px;overflow:hidden"><span style="display:block">ноябрь</span></div>`);S.box.appendChild(S.lab);
   S.date=odo('08.11','big');S.box.appendChild(S.date);
   S.ads=$(`<div style="position:absolute;left:0;bottom:0;font:800 300px/.9 'Inter Tight';letter-spacing:-.05em;color:var(--accent);opacity:0">ADsP</div>`);S.box.appendChild(S.ads);
 }},
 map:{build(S){
   S.tag=$(`<div class="label" style="position:absolute;right:110px;top:400px;opacity:0">автобус 130</div>`);layer.appendChild(S.tag);
 }},
 wc:{build(S){
   // cross section of the school building: floors 4..1, the camera walks down it
   S.box=$(`<div class="area" style="top:430px;height:670px"></div>`);layer.appendChild(S.box);
   S.svg=sv('svg',{width:1380,height:670});S.svg.style.cssText=MASK;S.box.appendChild(S.svg);
   S.R=1380/670;S.cam={cx:-390,cy:210,h:432};setVB(S);
   S.bldg=sv('g');S.svg.appendChild(S.bldg);
   const st=(x0,y0,dir)=>{let d=`M${x0} ${y0}`;for(let i=0;i<6;i++)d+=` h${dir*22} v70`;return d;};
   S.struct=sv('g',{fill:'none',stroke:INK,'stroke-opacity':.4,'stroke-width':5},
     `<path vector-effect="non-scaling-stroke" d="M-640 1680 V-60 H640 V1680"/><path vector-effect="non-scaling-stroke" d="M-780 1680 H780"/>
      ${[420,840,1260].map(y=>`<path vector-effect="non-scaling-stroke" d="M-640 ${y} H640"/>`).join('')}
      <path vector-effect="non-scaling-stroke" d="${st(500,420,1)}"/><path vector-effect="non-scaling-stroke" d="${st(-500,840,-1)}"/><path vector-effect="non-scaling-stroke" d="${st(500,1260,1)}"/>`);
   S.bldg.appendChild(S.struct);gsap.set(S.struct,{opacity:0});
   const T=[[[-490,402],[500,402]],[[500,402],[625,822]],[[625,822],[-500,822]],[[-500,822],[-625,1242]],[[-625,1242],[500,1242]],[[500,1242],[625,1662]],[[625,1662],[240,1662]]];
   S.track=T.map(t=>{const p=sv('path',{d:line(t),fill:'none',stroke:RED,'stroke-width':14,'stroke-linecap':'round'});S.bldg.appendChild(p);return p;});prep(S.track);
   S.flab=[4,3,2,1].map((n,k)=>{const t=sv('text',{x:-760,y:k*420+255,'text-anchor':'middle','font-size':130,fill:'#8a8a90'});t.textContent=n;S.bldg.appendChild(t);gsap.set(t,{opacity:0});return t;});
   S.doors=[];S.rows=[[],[],[]];
   for(let k=0;k<3;k++)for(let c=0;c<4;c++){const d=door(!(k===0&&c===0));S.bldg.appendChild(d);gsap.set(d,{x:-390+c*260,y:k*420+210,opacity:0});S.doors.push(d);S.rows[k].push(d);}
   S.first=S.doors[0];
   S.teacher=door(false);const tl0=S.teacher.querySelector('.latch');tl0.setAttribute('fill',GREEN);tl0.setAttribute('stroke',GREEN);S.bldg.appendChild(S.teacher);gsap.set(S.teacher,{x:130,y:1470,opacity:0});
   S.tlab=sv('text',{x:-10,y:1500,'text-anchor':'end','font-size':80,fill:GREEN});S.tlab.textContent='для учителей';S.bldg.appendChild(S.tlab);gsap.set(S.tlab,{opacity:0});
   S.rowLab=sv('text',{x:0,y:10,'text-anchor':'middle','font-size':50,fill:INK});S.rowLab.textContent='4 этаж';S.bldg.appendChild(S.rowLab);gsap.set(S.rowLab,{opacity:0});
   S.cigS=sv('svg',{viewBox:'0 0 1380 670',width:1380,height:670});S.cigS.style.cssText='position:absolute;left:0;top:0;overflow:visible';S.box.appendChild(S.cigS);
   S.cigS.innerHTML=`<g transform="translate(690 335) scale(1.1) translate(-410 -420)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="10">
     <path d="M250 430 H520 V470 H250 Z" stroke="${INK}"/><path d="M520 430 H570 V470 H520" stroke="${RED}"/>
     <path d="M560 410 C540 370 600 350 575 300 C555 260 610 240 590 200" stroke="#8a8a90"/>
     <circle cx="410" cy="420" r="240" stroke="${RED}" stroke-width="18"/><path d="M240 250 L580 590" stroke="${RED}" stroke-width="18"/></g>`;
   S.cigP=[...S.cigS.querySelectorAll('path,circle')];prep(S.cigP);
 }},
 han:{build(S){
   S.tag=$(`<div class="label" style="position:absolute;right:110px;top:400px;opacity:0">метро</div>`);layer.appendChild(S.tag);

const IDX=id=>STEPS.findIndex(s=>s.id===id);

  gsap.set(W.el,{opacity:s.vis});Object.assign(W.cam,s.cam);setVB(W);
  W.legs.forEach((p,k)=>p.style.strokeDashoffset=k<s.legs?0:W.len[k]);

// ===================== engine =====================
const stage=document.getElementById('stage'),chap=document.getElementById('chapter'),bar=document.getElementById('bar'),cbig=document.getElementById('cbig'),bat=document.getElementById('bat');
const cbigSp=cbig.querySelectorAll('span');
function fit(){const k=Math.min(innerWidth/1600,innerHeight/1200);stage.style.transform=`translate(-50%,-50%) scale(${k})`;}
fit();addEventListener('resize',fit);
gsap.set(cbigSp,{yPercent:115});

let cur=-1,S=null,sceneName=null,hlEl=null,tlNow=null,curChapter='';
const chapterOf=i=>{for(let k=i;k>=0;k--)if(STEPS[k].chapter!==undefined)return STEPS[k].chapter;return '';};
function chapterHTML(c){return c?`<span><b>${c.split('|')[0]}</b>${c.split('|')[1]}</span>`:'<span></span>';}
function setChapter(c,instant){
  if(c===curChapter)return;curChapter=c;
  if(instant){chap.innerHTML=chapterHTML(c);return;}
  gsap.to(chap.firstChild,{yPercent:-110,duration:.4,ease:'power2.in',onComplete:()=>{chap.innerHTML=chapterHTML(c);gsap.fromTo(chap.firstChild,{yPercent:110},{yPercent:0,duration:.8,ease:OUT});}});
}
// big chapter title in the headline zone, over whatever is moving underneath
// chapter change: the whole theme flips to red for a moment, the chapter title sits on it, then it flips back
function chapterIn(tl,c,at){const [n,t]=c.split('|');cbigSp[0].textContent=n;cbigSp[1].textContent=t;
  tl.to(chap,{opacity:0,duration:.25},at);
  tl.to(root,{...FLASH,duration:.3,ease:'power2.out'},at);tl.add(()=>setChapter(c,true),at+.3);
  tl.fromTo(cbigSp,{yPercent:115},{yPercent:0,duration:.9,ease:OUT,stagger:.08},at+.12);
  tl.to(cbigSp,{yPercent:-115,duration:.4,ease:'power2.in',stagger:.04},at+1.3);
  tl.to(root,{...LIGHT,duration:.35,ease:'power2.inOut'},at+1.55);
  tl.to(chap,{opacity:1,duration:.4},at+1.8);
  return at+1.9;}
// battery: one cell blinks out when energy is spent
let batLevel=null,batTl=null;
function setBat(n,anim,delay){const cells=[...bat.querySelectorAll('.cell')],body=bat.querySelector('.body');
  if(batTl){batTl.progress(1);batTl=null;}
  const paint=()=>{cells.forEach((c,k)=>{c.style.opacity=k<n?1:0;c.style.background=n<=1?'var(--accent)':'';});body.style.borderColor=n===0?'var(--accent)':'';};
  if(n===null){gsap.to(bat,{opacity:0,duration:anim?.4:0});batLevel=null;return;}
  if(batLevel===null){paint();gsap.to(bat,{opacity:1,duration:anim?.6:0,delay:anim?.8:0});}
  else if(anim&&n<batLevel){const c=cells[n];batTl=gsap.timeline({delay}).to(c,{opacity:.15,duration:.16,repeat:3,yoyo:true}).to(c,{opacity:0,duration:.3}).add(paint);}
  else paint();
  batLevel=n;}
function place(st,el){
  layer.appendChild(el);
  if(st.lay&&st.lay.side){el.style.top=(600-el.offsetHeight/2)+'px';}
  else el.style.top=((st.lay&&st.lay.top)||190)+'px';
}
function buildScene(name){layer.innerHTML='';S={};SCENES[name].build(S);sceneName=name;hlEl=null;}
function playStep(i,animate){
  const st=STEPS[i],tl=gsap.timeline({paused:!animate});
  if(hlEl){const old=hlEl;if(animate)hideWords(tl,old,0);else old.remove();}
  hlEl=headline(st.text,st.hl);place(st,hlEl);
  gsap.set(hlEl.querySelectorAll('.w>span'),{yPercent:115});
  revealWords(tl,hlEl,animate?.25:0);
  st.run(tl,S);
  if(!animate)tl.progress(1);
  return tl;
}
// video with a very short audio fade in/out
function playVideo(v){v.currentTime=0;v.muted=false;v.volume=0;v._fading=false;v.play().then(()=>gsap.to(v,{volume:1,duration:.3})).catch(()=>{});
  v.ontimeupdate=()=>{if(!v._fading&&v.duration&&v.duration-v.currentTime<.35){v._fading=true;gsap.to(v,{volume:0,duration:.3});}};}
function stopVideos(){layer.querySelectorAll('video').forEach(v=>{if(!v.paused)gsap.to(v,{volume:0,duration:.25,onComplete:()=>v.pause()});});}
function themeFor(i){return STEPS[i].id==='h3'?NIGHT:LIGHT;}

function go(i,opts={}){
  i=Math.max(0,Math.min(STEPS.length-1,i));if(i===cur&&!opts.force)return;
  const prev=cur;cur=i;const st=STEPS[i];
  if(tlNow)tlNow.progress(1);
  stopVideos();
  gsap.to(bar,{scaleX:i/(STEPS.length-1),duration:1.2,ease:IO});
  const forwardOne=(i===prev+1)&&!opts.instant;
  const newCh=chapterOf(i), chapterChange=newCh!==curChapter&&newCh!=='';
  if(forwardOne&&st.scene===sceneName&&chapterChange){
    // chapter starts inside the same scene (01): what is on screen stays, only the colour flips
    const out=gsap.timeline();
    if(hlEl){hideWords(out,hlEl,0);hlEl=null;}
    const end=chapterIn(out,newCh,.3);
    out.add(()=>{setChapter(newCh,true);tlNow=playStep(i,true);},end);
    tlNow=out;
  } else if(forwardOne&&st.scene===sceneName){
    setChapter(newCh);tlNow=playStep(i,true);
  } else if(forwardOne){
    const out=gsap.timeline();
    if(hlEl)hideWords(out,hlEl,0);
    out.to(layer.children,{opacity:0,y:-30,duration:.45,ease:'power2.in',stagger:.03},0);
    if(!chapterChange)out.to(root,{...themeFor(i),duration:.5},0);
    let buildAt=.55,playAt=.55;
    if(st.pre){const b=st.pre(out);if(b!==undefined)buildAt=b;}
    if(chapterChange){playAt=Math.max(buildAt,chapterIn(out,newCh,st.flashAt||.3))+.05;}else playAt=buildAt;
    out.add(()=>{buildScene(st.scene);if(st.onBuild)st.onBuild(S);},buildAt);
    out.add(()=>{setChapter(newCh,chapterChange);tlNow=playStep(i,true);},playAt);
    tlNow=out;
  } else {
    gsap.set(cbigSp,{yPercent:115});gsap.set(chap,{opacity:1});gsap.set(root,LIGHT);
    buildScene(st.scene);setChapter(newCh,true);
    let k=i;while(k>0&&STEPS[k-1].scene===st.scene)k--;
    for(let j=k;j<=i;j++)playStep(j,false);
    worldSet(i);
    gsap.fromTo(layer,{opacity:0},{opacity:1,duration:.35});
  }
  setBat(st.bat,forwardOne,st.batAt||1.4);
  if(st.video){const delay=forwardOne?1500:200;setTimeout(()=>{if(STEPS[cur]===st&&S[st.video])playVideo(S[st.video]);},delay);}
  try{history.replaceState(null,'','#'+(i+1));}catch(e){}
}
addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown',' ','Enter','ArrowDown'].includes(e.key)){e.preventDefault();go(cur+1);}
  else if(['ArrowLeft','PageUp','ArrowUp','Backspace'].includes(e.key)){e.preventDefault();go(cur-1);}
  else if(e.key==='Home')go(0);else if(e.key==='End')go(STEPS.length-1);
  else if(e.key==='f'||e.key==='F'||e.key==='а'||e.key==='А'){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen();}
});
addEventListener('click',e=>{if(e.button===0)go(cur+1);});
addEventListener('contextmenu',e=>{e.preventDefault();go(cur-1);});
document.fonts.ready.then(()=>{
  const h=parseInt((location.hash||'#1').slice(1))||1;
  worldSet(0);
  if(h===1){buildScene('title');cur=0;tlNow=playStep(0,true);}else go(h-1,{instant:true});
});
</script>
